services:
  ####################
  # PHP server
  ####################
  app:
    # コンテナの作成に使用するDockerfileのパス
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    # Viteのために5173ポートを開放（nodeが不要であればコメントアウト）
    ports:
      - ${NODE_PORT:-5173}:5173
    # DBが実際に接続を受け付けられる状態になってから起動する
    depends_on:
      mysql:
        condition: service_healthy
    # srcディレクトリをappコンテナの/var/www/htmlへマウント
    volumes:
      - ./src:/var/www/html
    networks:
      - backend

  ####################
  # Web server
  ####################
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    # ホスト側のポート:コンテナ側のポートを指定
    ports:
      - ${WEB_PORT:-8080}:80
    depends_on:
      - app
    # src配下のファイルをコンテナ内の~/var/www/html配下に配置
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # nginxのログをホスト側に永続化する
      - ./docker/nginx/logs:/var/log/nginx
    networks:
      # - frontend
      - backend

  ####################
  # DB server
  ####################
  mysql:
    build:
      context: .
      dockerfile: ./docker/mysql/Dockerfile
    # ホスト側のポート:コンテナ側のポートを指定
    ports:
      - ${DB_PORT:-3306}:3306
    volumes:
      - mysql-store:/var/lib/mysql
      # コンテナ初回起動時にinitdb.d配下のDDL実行
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
    # 環境変数の指定
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-test_db}
      - MYSQL_USER=${DB_USERNAME:-testuser}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-secret}
    # DBへの接続が実際に可能になるまでのヘルスチェック
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  ####################
  # Redis
  ####################
  redis:
    image: redis:8.10.0-alpine
    ports:
      - ${REDIS_PORT:-6379}:6379
    networks:
      - backend

  ####################
  # phpMyAdmin
  ####################
  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin
  #   ports:
  #     - "${PMA_PORT:-8888}:80"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     - PMA_ARBITRARY=1
  #     # mysqlサービス名を指定
  #     - PMA_HOST=mysql
  #     # 以下2行のコメントアウトを外せばログイン画面を出さずに開けるようになるがローカル環境以外では外さないこと
  #     # - PMA_USER=${DB_USERNAME:-testuser}
  #     # - PMA_PASSWORD=${DB_PASSWORD:-password}
  #   restart: always
  #   networks:
  #     - backend

  ####################
  # Mailpit
  ####################
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - backend
    # メール履歴を永続化したい場合は、restart指定に加えてMP_DATA_FILE環境変数とvolumeマウントを設定する
    # restart: unless-stopped
    # environment:
    #   MP_DATA_FILE: /tmp/mailpit
    # volumes:
    #   - ./mails/mailpit:/tmp/mailpit

volumes:
  # 名前付きボリュームを定義
  mysql-store:

networks:
  backend:
    driver: bridge
