server {
    listen 80;
    # ローカル開発用のホスト名（本番では実際のドメイン名に置き換える）
    server_name localhost;
    # ルートディレクトリ（ドキュメントルート）を指定
    root /var/www/html/public;

    # クリックジャッキング対策（自サイト以外のframe/iframeへの埋め込みを禁止）
    add_header X-Frame-Options "SAMEORIGIN";
    # レスポンスのContent-Typeを尊重させ、ブラウザによる中身の自動判定（MIMEスニッフィング）を無効化
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    # アクセスログ・エラーログをファイルと標準出力の両方に出力する
    access_log /var/log/nginx/access.log;
    access_log /dev/stdout;
    error_log /var/log/nginx/error.log;
    error_log /dev/stderr;

    # アップロード可能なリクエストボディの最大サイズ（php.iniのpost_max_sizeと揃える）
    client_max_body_size 128M;

    charset utf-8;

    # 全てのリクエスト
    location / {
        # リクエストされたファイルが存在しなければフロントコントローラーに内部リダイレクト
        try_files $uri $uri/ /index.php?$query_string;
    }

    # favicon/robots.txt個別のログ・404記録を抑制（ノイズになるため）
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # 404もフロントコントローラーに回してLaravel側のルーティング・エラーハンドリングに任せる
    error_page 404 /index.php;

    # 全ての PHP ファイル
    location ~ \.php$ {
        # FastCGI で PHP-FPM コンテナへ転送
        # PHP-FPMはデフォルトで9000番のポートを使用するため、PHPコンテナの9000番へルーティング
        fastcgi_pass app:9000;
        # PHP-FPM コンテナで実行する PHP ファイルの名前
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # デフォルトの FastCGI パラメーター
        include fastcgi_params;
    }

    # .well-known以外のドットファイル（.env、.gitなど）への直接アクセスを禁止
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
